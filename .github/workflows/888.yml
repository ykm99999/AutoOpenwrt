name: OpenWrt Build SL3000

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: .config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Init Env
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"

    - name: Clone OpenWrt
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Config & DIY (Crucial step)
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        # 先执行 defconfig 锁定 target
        make defconfig

    - name: Download PKG
      run: |
        cd openwrt
        # 跳过空文件的下载报错
        make download -j8 || true

    - name: Final Compile
      run: |
        cd openwrt
        # 强制编译工具链
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)
        # 编译 U-Boot
        make package/boot/uboot-mediatek/compile V=s -j1
        # 全量编译
        make -j$(nproc) || make -j1 V=s

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Firmware
        path: openwrt/bin/targets/mediatek/mt7981/*.bin
