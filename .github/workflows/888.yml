name: SL3000-eMMC-彻底解决版

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm99999/54
  REPO_BRANCH: 2410
  CONFIG_FILE: sl3000.config
  DIY_P2_SH: scripts/sl3000-patch.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: 物理环境初始化
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 物理克隆仓库源 (24.10/5.4)
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 更新 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 执行物理注入与彻底修复
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载源码 (物理粉碎旧记忆)
      run: |
        cd openwrt
        rm -rf tmp
        make defconfig
        make download -j8

    - name: 救砖固件物理编译逻辑
      run: |
        cd openwrt
        # 物理清理驱动冲突残留
        rm -rf tmp build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_mt7981/mac80211*
        make defconfig
        
        # 1. 物理编译工具链
        make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
        
        # 2. 强制物理编译 U-Boot (产出 FIP/DA 救砖核心)
        make package/boot/uboot-mediatek/compile V=s -j$(nproc)
        
        # 3. 全局物理编译
        make -j$(nproc) || make -j1 V=s

    - name: 物理提取 SL3000-eMMC 救砖包
      id: organize
      run: |
        cd openwrt/bin/targets/*/*
        mkdir -p /tmp/COLLECT
        # 像素级精准匹配 eMMC 救砖文件
        cp -f *emmc*fip* /tmp/COLLECT/ 2>/dev/null || true
        cp -f *DA* /tmp/COLLECT/ 2>/dev/null || true
        cp -f *emmc*u-boot* /tmp/COLLECT/ 2>/dev/null || true
        cp -f *emmc*sysupgrade.bin /tmp/COLLECT/ 2>/dev/null || true
        
        rm -rf *
        cp -af /tmp/COLLECT/* . 2>/dev/null || true
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传救砖成果
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: SL3000_eMMC_Full_Recovery
        path: ${{ env.FIRMWARE }}
