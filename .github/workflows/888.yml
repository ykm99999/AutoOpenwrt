name: OpenWrt Builder SL3000 Final

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm99999/AutoOpenwrt
  REPO_BRANCH: 2410
  UBOOT_REPO_URL: https://github.com/ykm99999/AutoOpenwrt
  UBOOT_BRANCH: sl3000-uboot-base
  FEEDS_CONF: feeds.conf.default
  # 配置文件路径（支持根目录或 custom-config/ 下）
  CONFIG_FILE: sl3000.config
  CONFIG_FILE_ALT: custom-config/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/share/vcpkg /var/lib/apt/lists/*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"

    - name: Install libyaml-dev
      run: sudo apt-get install -y libyaml-dev

    - name: Clone main OpenWrt source
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Clone U-Boot source to src/
      run: |
        git clone --depth 1 $UBOOT_REPO_URL -b $UBOOT_BRANCH openwrt/package/boot/uboot-mediatek/src

    - name: Execute diy-part1.sh (before feeds)
      run: |
        if [ -f "$DIY_P1_SH" ]; then
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
        else
          echo "diy-part1.sh not found, skipping"
        fi

    - name: Update/Install feeds
      run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cd openwrt
        # 尝试从两个可能的位置复制配置文件
        if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          cp -f $GITHUB_WORKSPACE/$CONFIG_FILE .config
          echo "✅ 使用配置文件: $CONFIG_FILE"
        elif [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE_ALT" ]; then
          cp -f $GITHUB_WORKSPACE/$CONFIG_FILE_ALT .config
          echo "✅ 使用配置文件: $CONFIG_FILE_ALT"
        else
          echo "⚠️ 未找到配置文件，将使用默认配置"
        fi

    - name: Execute diy-part2.sh
      run: |
        cd openwrt
        chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Compile the firmware
      run: |
        cd openwrt
        echo "1. 编译工具链..."
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)
        
        echo "2. 编译 U-Boot (使用本地 src 源码)..."
        make package/uboot-mediatek/compile V=s -j1
        
        echo "3. 执行镜像合成..."
        make -j$(nproc) || make -j1 V=s

    - name: Organize files
      id: organize
      run: |
        mkdir -p $GITHUB_WORKSPACE/FIRMWARE_OUT
        find openwrt/bin/targets/ -name "*sl_3000-emmc*" -exec cp -f {} $GITHUB_WORKSPACE/FIRMWARE_OUT/ \;
        echo "FIRMWARE=$GITHUB_WORKSPACE/FIRMWARE_OUT" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      with:
        name: SL3000_Firmware
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: env.UPLOAD_RELEASE == 'true'
      with:
        tag_name: SL3000_Build_${{ github.run_id }}
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
