name: SL3000-eMMC-最终物理解决版

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm99999/54
  REPO_BRANCH: 2410
  CONFIG_FILE: sl3000.config
  DIY_P2_SH: scripts/sl3000-patch.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: 物理克隆仓库
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf openwrt $GITHUB_WORKSPACE/openwrt

    - name: 更新 Feeds 并物理阻断
      run: |
        cd openwrt
        ./scripts/feeds update -a
        # 物理粉碎 feeds 中可能带有的 mac80211 软链接
        rm -rf feeds/base/package/kernel/mac80211
        ./scripts/feeds install -a

    - name: 执行物理注入与彻底修复
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 物理清理编译残留 (防止 6.6.15 幻像)
      run: |
        cd openwrt
        # 物理移除所有指向 mac80211 的标记文件
        rm -rf staging_dir/target-aarch64_cortex-a53_musl/stamp/.package_kernel_mac80211*
        rm -rf build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_mt7981/mac80211*
        make defconfig

    - name: 下载源码 (物理离线化检查)
      run: |
        cd openwrt
        make download -j8

    - name: 救砖固件物理编译
      run: |
        cd openwrt
        make toolchain/install -j$(nproc)
        # 强制物理编译已修复的 mac80211
        make package/kernel/mac80211/compile V=s -j1
        make package/boot/uboot-mediatek/compile V=s -j$(nproc)
        make -j$(nproc) || make -j1 V=s

    - name: 提取救砖成果
      run: |
        cd openwrt/bin/targets/*/*
        mkdir -p /tmp/COLLECT
        cp -f *emmc*fip* /tmp/COLLECT/ 2>/dev/null || true
        cp -f *DA* /tmp/COLLECT/ 2>/dev/null || true
        cp -f *emmc*sysupgrade.bin /tmp/COLLECT/ 2>/dev/null || true
        rm -rf * && cp -af /tmp/COLLECT/* .
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传救砖包
      uses: actions/upload-artifact@main
      with:
        name: SL3000_eMMC_Final_Fixed
        path: ${{ env.FIRMWARE }}
