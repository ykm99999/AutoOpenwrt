name: 一键修复推送到仓库源 (Repo-Fixer V5 - Branch 2410)

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 物理检出 2410 分支
        uses: actions/checkout@v4
        with:
          ref: 2410
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. 物理重写 mt7981.mk (禁用 EOF)
        run: |
          set -e
          # 物理锁定 2410 分支下的路径
          MK_FILE="target/linux/mediatek/image/mt7981.mk"
          
          if [ ! -f "$MK_FILE" ]; then
            echo "⚠️ 路径不匹配，正在全分支检索 mt7981.mk..."
            MK_FILE=$(find . -name "mt7981.mk" | head -n 1)
          fi

          if [ -z "$MK_FILE" ]; then
            echo "❌ 物理熔断：未找到目标文件"
            exit 1
          fi

          echo "✅ 命中物理路径: $MK_FILE"
          
          # 使用 printf 执行最高级别物理覆盖，彻底修正 mt798x-gpt
          printf '#\n# Target Makefile for MediaTek Filogic 820 (MT7981) - Full Aligned for SL-3000\n#\n\nKERNEL_LOADADDR := 0x48080000\n\n# 常用软件包\nMT7981_USB_PKGS := automount blkid blockdev fdisk \\\n    kmod-nls-cp437 kmod-nls-iso8859-1 kmod-usb2 kmod-usb3 \\\n    luci-app-usb-printer luci-i18n-usb-printer-zh-cn \\\n    kmod-usb-net-rndis usbutils \\\n    kmod-usb-net-qmi-wwan autoksmbd\n\n# --- 标准版定义 ---\ndefine Device/sl_3000\n  DEVICE_VENDOR := SL\n  DEVICE_MODEL := 3000\n  DEVICE_DTS := mt7981-sl-3000\n  DEVICE_DTS_DIR := $(DTS_DIR)/mediatek\n  SUPPORTED_DEVICES := sl,3000\n  DEVICE_PACKAGES := $(MT7981_USB_PKGS) f2fsck losetup mkf2fs kmod-fs-f2fs kmod-mmc \\\n\tluci-app-ksmbd luci-i18n-ksmbd-zh-cn ksmbd-utils\n  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata\nendef\nTARGET_DEVICES += sl_3000\n\n# --- eMMC 1024M 物理全对齐定义 ---\ndefine Device/sl_3000-emmc\n  DEVICE_VENDOR := SL\n  DEVICE_MODEL := 3000 eMMC\n  DEVICE_DTS := mt7981-sl-3000-emmc\n  DEVICE_DTS_DIR := $(DTS_DIR)/mediatek\n  SUPPORTED_DEVICES := sl,3000-emmc\n  DEVICE_DRAM_SIZE := 1024M\n  DEVICE_PACKAGES := $(MT7981_USB_PKGS) f2fsck losetup mkf2fs kmod-fs-f2fs kmod-mmc \\\n\tluci-app-ksmbd luci-i18n-ksmbd-zh-cn ksmbd-utils\n  \n  # 物理修复：仅保留 sysupgrade\n  IMAGES := sysupgrade.bin\n  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata\n\n  # 物理生成：救砖全家桶\n  # 审计修复：将 mt798x-gpt 物理修正为 mtk-gpt\n  ARTIFACTS := emmc-gpt.bin emmc-preloader.bin emmc-bl31-uboot.fip\n  ARTIFACT/emmc-gpt.bin := mtk-gpt emmc\n  ARTIFACT/emmc-preloader.bin := mt7981-bl2 emmc-ddr3\n  ARTIFACT/emmc-bl31-uboot.fip := mt7981-bl31-uboot emmc-ddr3\nendef\nTARGET_DEVICES += sl_3000-emmc\n' > "$MK_FILE"
          
          echo "✅ $MK_FILE 修复指令执行完毕"

      - name: 3. 物理推送回 2410 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "物理逻辑一致，无需推送。"
          else
            git commit -m "fix(image): 针对 2410 分支执行 GPT 宏定义物理修复"
            git push origin 2410
